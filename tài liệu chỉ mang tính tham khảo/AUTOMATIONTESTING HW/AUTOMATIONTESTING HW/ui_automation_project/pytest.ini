[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    ts01: TS-01 Personal Information (official 186-TC library, TS01.xlsx, 27 cases)
    ts02: TS-02 Contact Information (official 186-TC library, TS02.xlsx, 22 cases)
    ts03: TS-03 Emergency Contact Information (official 186-TC library, TS03.xlsx, 24 cases)
    ts04: TS-04 Residential Address, Singapore (official 186-TC library, TS04.xlsx, 25 cases)
    ts05: TS-05 Residential Address, Non-Singapore (official 186-TC library, TS05.xlsx, 23 cases)
    ts06: TS-06 Save Behaviour and Cross-field Rules (official 186-TC library, TS06.xlsx, 23 cases)
    ts07: TS-07 Cancel and Navigation (official 186-TC library, TS07.xlsx, 12 cases)
    ts08: TS-08 Findings Confirmed Against the Real Build (official 186-TC library, TS08.xlsx, 12 cases)
    ts09: TS-09 Additional Findings from Extended Review (official 186-TC library, TS09.xlsx, 18 cases)
    known_defect: test intentionally asserts FSD-required behavior against a
        real, already-logged build defect (see docs/DEFECTS.md) — a FAIL here
        is expected and correct, not a regression.
addopts =
    -ra
    --html=artifacts/reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=artifacts/test-results
