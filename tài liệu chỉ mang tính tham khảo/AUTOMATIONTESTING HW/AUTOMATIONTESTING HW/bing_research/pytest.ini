[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    us01: User Story 1 - Bing search to MaivenPoint Community workflow
addopts =
    -ra
    --html=artifacts/reports/report.html
    --self-contained-html
    --alluredir=artifacts/allure-results
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=artifacts/test-results
