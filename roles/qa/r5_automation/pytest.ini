[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
base_url = http://localhost:5173
markers =
    real: Real UI tests of the admin portal on localhost (tests/real, School User, Paper applications)
    readonly: the test only reads data (real UI suite)
    mutating: the test creates or submits data on the real stack
    smoke: quick check that school sign in and paper applications screen load
    f51: F5.1 Upload applications list
    f52: F5.2 Upload scans dialog
    f53: F5.3 Review application, Part 1 Applicant
    f54: F5.4 Review application, Part 2 Children
    f55: F5.5 Review application, Part 3 Family and household
    f56: F5.6 Review application, Part 4 Context and Part 5 Declaration
    f57: F5.7 Drafts
    f58: F5.8 Review and submit validation
    f59: F5.9 Review before submitting dialog
    f510: F5.10 Confirm and submit and routing
    f511: F5.11 View and edit submitted application
    f512: F5.12 Access, API and data
    draft: the test case depends on an open assumption (ASM-R5-xx)
    known_defect(reason): asserts the FS required behavior against a candidate defect
    not_automated: placeholder test that lists a case requiring manual/hardware action
addopts =
    -ra
    --alluredir=artifacts/allure-results
    --clean-alluredir
    --html=artifacts/reports/report.html
    --self-contained-html
    --junitxml=artifacts/reports/junit.xml
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=artifacts/test-results
