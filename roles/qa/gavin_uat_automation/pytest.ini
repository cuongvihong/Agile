[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    --import-mode=importlib
    -ra
    --strict-markers
    --tb=short
markers =
    case(id): the UAT case id of the master (for example UAT-PAR-01)
    mutating: changes data in the database or in the application
    needs_db: needs Docker with the SQL Server container edufams-qa-sqlserver
    precondition: creates the data the UAT cases need (UAT-PRE-*)
    needs_simulator: needs the payment checkout simulator (port 5176)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
