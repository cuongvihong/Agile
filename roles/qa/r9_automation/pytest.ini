[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
base_url = http://localhost:5174
markers =
    rules: quy tắc kiểm tra dữ liệu bổ sung vào FS 09 (TC-173 đến TC-206), file tests/test_f99_validation_rules.py
    smoke: kiểm tra nhanh môi trường, đăng nhập và điều hướng
    f91: F9.1 Truy cập và danh sách con
    f92: F9.2 Khoản phí còn nợ và số dư EA
    f93: F9.3 Phương thức thanh toán và điều kiện
    f94: F9.4 Thanh toán bằng Education Account
    f95: F9.5 Thanh toán online và chia khoản
    f96: F9.6 Webhook và đối soát
    f97: F9.7 Kết quả, biên lai và thử lại
    f98: F9.8 Quy tắc dữ liệu và ràng buộc DB
    readonly: chỉ đọc, không ghi dữ liệu, chạy lại được (mặc định nếu test không có nhãn loại)
    mocked: chặn một request bằng route để giả lỗi hoặc trạng thái, dữ liệu thật không đổi
    api: gọi API bằng session đang đăng nhập, chỉ gửi yêu cầu mong đợi bị từ chối
    mutating: ghi dữ liệu thật (tiêu khoản phí, trừ tiền ví EA), cần R9_ALLOW_PAYMENTS=1
    online: cần simulator thanh toán (cổng 5176) đang chạy
    admin: chỉ mở trang đăng nhập của admin portal (R9_ADMIN_URL, mặc định cổng 5173), không đăng nhập, không ghi dữ liệu
    destructive: làm cạn ví EA hoặc kẹt giao dịch, chỉ chạy một lần cho mỗi lần nạp dữ liệu
    draft: kỳ vọng phụ thuộc giả định chưa được BA xác nhận (ASM-R9-UI-xx trong README)
    known_defect(reason): kiểm tra đúng yêu cầu của FS, dự kiến FAIL vì lệch đã biết, XFAIL là còn lệch, XPASS là đã sửa
    extra: test ngoài danh sách R9, kiểm tra hành vi UI thật
    not_automated: case của R9 chưa có test, hiện dưới dạng test bị bỏ qua kèm lý do
addopts =
    -ra
    --alluredir=artifacts/allure-results
    --clean-alluredir
    --html=artifacts/reports/report.html
    --self-contained-html
    --junitxml=artifacts/reports/junit.xml
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=artifacts/test-results
