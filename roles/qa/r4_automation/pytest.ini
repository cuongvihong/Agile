[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
base_url = http://localhost:5173
markers =
    real: Real UI tests of the admin portal on localhost (tests/real, MOE HQ, FAS schemes)
    readonly: the test only reads data (real UI suite)
    mutating: the test creates data on the real stack, names start with R4-AUTO (tools/cleanup_r4_auto.sql)
    f41: F4.1 Submit routing
    f42: F4.2 MOEFAS ranking and assessment
    f43: F4.3 Applications list, MOE HQ
    f44: F4.4 Applications list, School Admin
    f45: F4.5 Filters and search
    f46: F4.6 Export
    f47: F4.7 Review drawer, MOEFAS
    f48: F4.8 Review drawer, SBFAS
    f49: F4.9 Approve SBFAS
    f410: F4.10 Reject SBFAS
    f411: F4.11 One decision per application
    f412: F4.12 Access and security
    f413: F4.13 FAS schemes list
    f414: F4.14 New scheme wizard
    f415: F4.15 Review and publish
    f416: F4.16 Add fee to a published scheme
    f417: F4.17 Close form now (demo)
    f418: F4.18 Effects after a decision
    f419: F4.19 ML recommendation and risk
    f420: F4.20 Formats
    draft: the test case depends on an open assumption (ASM-R4-xx), expected result may change after BA answers
    known_defect(reason): asserts the FS required behavior against a candidate defect found in the prototype, XFAIL means the defect is still there, XPASS means it is fixed
    not_automated: placeholder test that lists a case no test automates, always skipped
    sbfas: SBFAS schemes screens of the School user (tests/real/test_real_f4s_sbfas.py)
    validation: validation rules of the schemes, API and wizard messages (tests/real/test_real_f4v_validation.py)
    smoke: quick check that the setup, sign in and navigation work
addopts =
    -ra
    --alluredir=artifacts/allure-results
    --clean-alluredir
    --html=artifacts/reports/report.html
    --self-contained-html
    --junitxml=artifacts/reports/junit.xml
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=artifacts/test-results
